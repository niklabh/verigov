name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  chain:
    name: Build, lint, test, run demo
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/ubuntu-dependencies

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Build node and runtime (release)
        run: cargo build --release --locked
        timeout-minutes: 90

      - name: Clippy
        run: |
          SKIP_WASM_BUILD=1 cargo clippy --release --all-targets --locked --workspace --quiet
          SKIP_WASM_BUILD=1 cargo clippy --release --all-targets --all-features --locked --workspace --quiet
        timeout-minutes: 30

      - name: Pallet unit tests
        run: SKIP_WASM_BUILD=1 cargo test --release --locked -p pallet-verigov
        timeout-minutes: 15

      - name: Docs
        run: SKIP_WASM_BUILD=1 cargo doc --release --workspace --no-deps --locked
        timeout-minutes: 15

      - name: Install tool dependencies
        run: npm ci --no-fund --no-audit
        working-directory: tools

      - name: Offline builder smoke test
        run: |
          BIN="$(node tools/builder/build.js --version 1.2.3 --commit c0ff33d | tee /dev/stderr | awk '/pinned binary/ {print $4}')"
          test -n "$BIN"
          OUT="$(sh "$BIN" sum 2 3)"
          echo "$OUT"
          test "$OUT" = "$(printf 'acme-utils 1.2.3 (commit c0ff33d)\n5')"

      - name: End-to-end demo against a --dev node
        run: ./scripts/run-demo.sh
        timeout-minutes: 10

      - name: Upload node log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verigov-node-log
          path: /tmp/verigov-node.log
          if-no-files-found: ignore
